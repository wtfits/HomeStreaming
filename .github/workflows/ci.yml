name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests + web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build web client (includes Chrome 79 target check)
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  e2e:
    name: Playwright E2E (desktop, iPhone, webOS)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Playwright Chromium
        run: cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run E2E
        run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

  dist:
    name: Build release binaries
    runs-on: ubuntu-24.04
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pushes to main become release v0.1.<run number>; a pushed v* tag keeps
      # its name; other branches get a dev version (git describe) that the
      # in-app updater treats as "not a release".
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            v="v0.1.${GITHUB_RUN_NUMBER}"
          else
            v="$(git describe --tags --always --dirty)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Cross-compile (web client embedded)
        run: make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: homestreaming-windows-amd64
          path: dist/homestreaming-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: homestreaming-linux-and-mac
          path: |
            dist/homestreaming-linux-amd64.tar.gz
            dist/homestreaming-linux-arm64.tar.gz
            dist/homestreaming-darwin-arm64.tar.gz

  release:
    name: GitHub release (main and v* tags)
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    needs: [dist, e2e]
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: homestreaming-*
          merge-multiple: true
      # SHA256SUMS is what the in-app updater verifies downloads against.
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude "$VERSION" HEAD 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s' "$prev..HEAD"
            else
              echo "Changes:"
              echo
              git log --no-merges --pretty='- %s' -n 30
            fi
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
